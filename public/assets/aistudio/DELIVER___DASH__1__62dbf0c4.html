<style>

html,body{height:100%;margin:0;background:#6bd34a;font-family:system-ui,Tahoma,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;color:#fff}
canvas{display:block;position:fixed;inset:0}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.yb{background:linear-gradient(#fcd34d,#f59e0b);color:#3b2400;font-weight:800;border-radius:14px;padding:10px 14px;width:100%;margin-top:8px;border:2px solid #b45309;box-shadow:0 3px 0 #b45309}

#mbox{background:linear-gradient(#4ade80,#16a34a);border:3px solid #fff;border-radius:16px;padding:4px 14px;font-size:22px;font-weight:900;display:inline-block}
#trophy{background:#fff;color:#111;border-radius:14px;padding:2px 12px;font-weight:700;margin-top:6px;display:inline-block}
#dayp{margin-top:6px;font-size:12px;line-height:1.7;max-width:210px}
#dlgw{position:fixed;inset:auto 0 calc(14px + env(safe-area-inset-bottom,0px)) 0;display:none;justify-content:center;padding:0 12px;z-index:45}
#dlg{background:var(--pu);border:3px solid var(--bd);border-radius:18px;padding:16px;width:min(420px,100%);box-shadow:0 8px 30px #0008}
#phone{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(300px,92vw);background:#fff4dc;border:6px solid #1e1b4b;border-radius:34px;z-index:40;display:none;flex-direction:column;overflow:hidden;color:#111}

#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffd}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.t{background:#000c;padding:6px 14px;border-radius:10px;font-size:14px}

<div id="phone">

</div>
<div id="dlgw"><div id="dlg"></div></div>

<script>
const S={money:0,total:0,day:1,min:480,dayOn:false,phone:false,own:false,lvl:1,wup:[0,0,0],apps:{yw:0,bc:0,is:0},gig:null,gigs:[],started:false,won:false,ring:null};
const WC=[300,1000,2500],LC=[500,1500,3000,6000],WN=['محفظة جلدية','حافظة نقود ذكية','محفظة ذهبية'];
const AP={yw:['YOUWATCH','▶️',1000,100,null],bc:['BIBCOIN','₿',2500,200,'yw'],is:['ISTOCKS','📈',6000,350,'bc']};
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const mult=()=>1+.25*S.wup.reduce((a,b)=>a+b,0);
const ready=()=>S.lvl>=5&&S.wup.every(x=>x);
// صوت
let AC;function beep(f=600,d=.12,t='sine'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{beep(660,.1);setTimeout(()=>beep(880,.15),100)},bad=()=>beep(180,.25,'sawtooth');
function toast(m){const e=document.createElement('div');e.className='t';e.textContent=m;$('toast').appendChild(e);setTimeout(()=>e.remove(),2600)}
function add(n,q){S.money+=n;if(n>0)S.total+=n;if(!q)n>0?good():bad()}
function spend(n){if(S.money<n){bad();toast('❌ رصيدك لا يكفي');return false}add(-n,1);beep(400,.1);return true}
function tf(m){const h=Math.floor(m/60),mm=String(Math.floor(m%60)).padStart(2,'0');return (h%12||12)+':'+mm+(h>=12?' م':' ص')}
// مشهد
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd8ff);scene.fog=new THREE.Fog(0x8fd8ff,90,260);
const cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,400);
const QL=[['HD',1280],['2K',2560],['4K',3840]];let qi=2;const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
function setQ(){ren.setPixelRatio(Math.min(3,Math.max(1,QL[qi][1]/innerWidth)));ren.setSize(innerWidth,innerHeight)}
setQ();document.body.prepend(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x6b8f5a,.85);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1d6,.75);sun.position.set(60,100,40);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,near:10,far:300});sun.shadow.bias=-.0005;scene.add(sun);
const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o));
function box(w,h,d,x,y,z,c,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||mat(c));o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function label(t,x,y,z,s=16){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.scale(2,2);g.fillStyle='#fbbf24';g.beginPath();g.roundRect?g.roundRect(8,8,496,112,30):g.rect(8,8,496,112);g.fill();g.fillStyle='#3b2400';g.font='bold 58px Tahoma,Arial';g.textAlign='center';g.fillText(t,256,84);const p=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));p.position.set(x,y,z);p.scale.set(s,s/4,1);scene.add(p)}
const R=[-100,-60,-20,20,60,100];
box(500,1,500,0,-.5,0,0x6bd34a);
R.forEach(r=>{box(208,.2,8,0,.1,r,0x3a3f55);box(8,.2,208,r,.1,0,0x3a3f55)});
const dm=new THREE.Object3D();
function inst(list,w,h,d,c){const m=new THREE.InstancedMesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}),list.length);list.forEach((p,i)=>{dm.position.set(p[0],.25,p[1]);dm.updateMatrix();m.setMatrixAt(i,dm.matrix)});scene.add(m)}
const dh=[],dv=[],ch=[],cv=[];
R.forEach(r=>{for(let t=-100;t<=100;t+=6){if(R.some(q=>Math.abs(t-q)<6))continue;dh.push([t,r]);dv.push([r,t])}
 R.forEach(q=>{for(let s=-3;s<=3;s+=1.5){ch.push([q+s,r-6.5],[q+s,r+6.5]);cv.push([q-6.5,r+s],[q+6.5,r+s])}})});
inst(dh,3,.05,.4,0xfacc15);inst(dv,.4,.05,3,0xfacc15);inst(ch,1,.05,3,0xffffff);inst(cv,3,.05,1,0xffffff);
function wtex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#1e3a5f';g.fillRect(0,0,64,64);for(let y=4;y<64;y+=16)for(let x=4;x<64;x+=16){g.fillStyle=Math.random()<.5?'#7dd3fc':'#bae6fd';g.fillRect(x,y,10,10)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,4);t.magFilter=THREE.NearestFilter;return t}
const WT=wtex();
function tree(x,z){box(1,3,1,x,1.8,z,0x7f5539);const f=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4,0),mat(0x2f9e44));f.position.set(x,5,z);scene.add(f)}
function roofHouse(x,z,w,h,d,rc,wc=0xf3e5d0){box(w,h,d,x,h/2+.35,z,wc);const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,h*.55,4),mat(rc));r.rotation.y=Math.PI/4;r.position.set(x,h+.35+h*.27,z);scene.add(r);box(2,3,.3,x,2,z+d/2+.1,0x7f5539);return r}
function tower(x,z,h,w=10){const m=mat(0xffffff,{map:WT});box(w,h,w,x,h/2+.35,z,0,m);box(w+.4,1,w+.4,x,h+.8,z,0x1f2937)}
function ring(x,z,c,k){const m=new THREE.Mesh(new THREE.RingGeometry(2.6,3.6,32),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,.45,z);scene.add(m);rings.push({x,z,k,m})}
const cols=[],houses=[],rings=[],roofs=[],pal=[0xdc2626,0xea580c,0x7c3aed,0x0d9488,0x2563eb,0xdb2777];
let hubP,phoneP,gigP,homeP,homeRoof,homeBody;
const col=(x,z,w,d)=>cols.push({x,z,w,d});const pizzas=[];
function pizza(cx,cz){box(22,8,14,cx,4.3,cz,0xf5deb3);box(23,1.2,15,cx,8.6,cz,0xb91c1c);[-8,-4,0,4,8].forEach((o,n)=>box(2,.3,3.2,cx+o,6.2,cz+8.3,n%2?0xffffff:0xdc2626));box(8,4,.4,cx,4,cz+7.1,0x7dd3fc);const s=new THREE.Mesh(new THREE.ConeGeometry(3,.6,3),mat(0xfbbf24));s.rotation.x=Math.PI/2;s.position.set(cx,12,cz+1);scene.add(s);label('🍕 Terry’s Pizza',cx,15,cz,18);col(cx,cz,22,14);pizzas.push({x:cx,z:cz+17});ring(cx,cz+17,0xfacc15,'pizza')}
function atex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#e8d5b0';g.fillRect(0,0,64,64);for(let y=6;y<64;y+=21)for(let x=6;x<64;x+=21){g.fillStyle='#7c5c3b';g.fillRect(x,y,12,13);g.fillStyle=Math.random()<.5?'#fde68a':'#93c5fd';g.fillRect(x+2,y+2,8,9)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);t.magFilter=THREE.NearestFilter;return t}
const AT=atex();WT.anisotropy=AT.anisotropy=ren.capabilities.getMaxAnisotropy();
function apt(cx,cz){[-8,8].forEach(o=>{box(10,16,24,cx+o,8.35,cz,0,mat(0xffffff,{map:AT}));box(10.6,.8,24.6,cx+o,16.8,cz,0xb45309);box(2,1.6,.3,cx+o,1.2,cz+12.1,0x7f5539);col(cx+o,cz,10,24);houses.push({x:cx+o,z:cz,id:houses.length+1})});box(6,10,6,cx,5.4,cz,0xd6c3a0);col(cx,cz,6,6);label('🏢 شقق',cx,22,cz,12)}
const pick=g=>g.t==='pizza'?pizzas.reduce((a,b)=>Math.hypot(a.x-pl.position.x,a.z-pl.position.z)<Math.hypot(b.x-pl.position.x,b.z-pl.position.z)?a:b):hubP;
for(let i=0;i<5;i++)for(let j=0;j<5;j++){
  const cx=(i-2)*40,cz=(j-2)*40,k=''+i+j;
  box(32,.3,32,cx,.15,cz,0xb4b9c2);box(28,.4,28,cx,.2,cz,0x7ddc5a);
  if(k==='11'){phoneP={x:cx,z:cz+17};box(10,5,8,cx,2.9,cz,0x1b8a8f);box(11,.6,4,cx,5.4,cz+4,0xfacc15);box(9,2,.3,cx,3,cz+4.1,0x9be7ff);label('PHONE SHOP',cx,9,cz,14);col(cx,cz,10,8);ring(phoneP.x,phoneP.z,0xfacc15,'phone');continue}
  if(k==='31'){hubP={x:cx,z:cz+17};box(18,9,11,cx,4.8,cz,0x1d4ed8);box(19,1,12,cx,9.8,cz,0xf1f5f9);label('📦 Parcel Hub',cx,14,cz,16);col(cx,cz,18,11);ring(hubP.x,hubP.z,0xfacc15,'hub');continue}
  if(k==='33'){gigP={x:cx,z:cz+17};tower(cx,cz,52,14);label('GIG COMPANY',cx,60,cz,20);col(cx,cz,14,14);ring(gigP.x,gigP.z,0xfacc15,'gig');continue}
  if(k==='13'){homeP={x:cx,z:cz+17};homeRoof=roofHouse(cx,cz,12,7,10,0xea580c);homeBody=scene.children[scene.children.length-3];label('🏠 بيتك',cx,16,cz,14);col(cx,cz,12,10);ring(cx-5,cz+17,0xef4444,'save');ring(cx+5,cz+17,0x3b82f6,'start');continue}
  if(k==='22'||k==='02'||k==='42'){box(26,.1,3,cx,.45,cz,0xe7d3a1);box(3,.1,26,cx,.45,cz,0xe7d3a1);const f=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.8,1,16),mat(0xcbd5e1));f.position.set(cx,.9,cz);scene.add(f);const w=new THREE.Mesh(new THREE.CylinderGeometry(3,3,1.1,16),mat(0x38bdf8));w.position.set(cx,1,cz);scene.add(w);const p=new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.5,.2,16),mat(0x38bdf8));p.position.set(cx+8,.5,cz+8);scene.add(p);[[-9,-9],[-9,9],[9,-9],[-10,0],[10,-3],[4,-10]].forEach(t=>tree(cx+t[0],cz+t[1]));continue}
  if(k==='21'||k==='43'){pizza(cx,cz);continue}if((i+j)%3===0&&i<2){apt(cx,cz);continue}if((i+j)%3===0){[[-8,-8],[8,-8],[-8,8],[8,8]].forEach(p=>{tower(cx+p[0],cz+p[1],22+Math.random()*16,10);col(cx+p[0],cz+p[1],10,10)});continue}
  [[-7.5,-7.5],[7.5,-7.5],[-7.5,7.5],[7.5,7.5]].forEach((p,n)=>{roofHouse(cx+p[0],cz+p[1],9,6,9,pal[(i*3+j*5+n)%6]);col(cx+p[0],cz+p[1],9,9);houses.push({x:cx+p[0],z:cz+p[1],id:houses.length+1})});
}
for(let a=0;a<12;a++){tree(-112,-100+a*18);tree(112,-100+a*18)}
// سيارات
const cars=[];for(let n=0;n<10;n++){const g=new THREE.Group(),c=[0xef4444,0x8b5cf6,0xfacc15,0xf8fafc,0x06b6d4][n%5];[[2.2,1,4.4,.9,c],[1.8,.8,2,1.8,0x1e293b]].forEach(b=>{const m=new THREE.Mesh(new THREE.BoxGeometry(b[0],b[1],b[2]),mat(b[4]));m.position.y=b[3];g.add(m)});const r=R[n%6],dir=n%2?1:-1,hz=n%4<2;g.userData={r,dir,hz,v:8+Math.random()*6,t:-100+Math.random()*200};if(hz)g.rotation.y=Math.PI/2;scene.add(g);cars.push(g)}
